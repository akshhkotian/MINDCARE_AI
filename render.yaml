services:
  - type: web
    name: mindcare-ai
    runtime: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "gunicorn --chdir backend --workers 2 --threads 4 --timeout 120 'app:create_app()'"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
