    <title>MindCare AI – Cognitive Care & Memory Assistant</title>

    <!-- Defensive React DOM patch for Google Translate / Neural Machine Translation -->
    <script>
      (function() {
        if (typeof Node === 'function' && Node.prototype) {
          var originalRemoveChild = Node.prototype.removeChild;
          Node.prototype.removeChild = function(child) {
            if (child.parentNode !== this) {
              if (window.console && console.warn) {
                console.warn('React DOM Node.removeChild safely bypassed: child node already reorganized by translator.');
              }
              return child;
            }
            return originalRemoveChild.apply(this, arguments);
          };

          var originalInsertBefore = Node.prototype.insertBefore;
          Node.prototype.insertBefore = function(newNode, referenceNode) {
            if (referenceNode && referenceNode.parentNode !== this) {
              if (window.console && console.warn) {
                console.warn('React DOM Node.insertBefore safely bypassed: referenceNode not in parent.');
              }
              return newNode;
            }
            return originalInsertBefore.apply(this, arguments);
          };
        }
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <body>
    <!-- Google Neural Machine Translation Container (Silent, Background) -->
    <div id="google_translate_element" style="display:none !important; position:absolute; top:-9999px; left:-9999px;" aria-hidden="true"></div>
    <script>
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,kn,ta,te,bn,mr,gu,ml',
            autoDisplay: false,
            layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE
          }, 'google_translate_element');
        }
      }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
